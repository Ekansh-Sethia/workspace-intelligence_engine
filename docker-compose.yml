version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: wie_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wie_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wie_password}
      POSTGRES_DB: ${POSTGRES_DB:-wie_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wie_user} -d ${POSTGRES_DB:-wie_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wie_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: wie_qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wie_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-wie_user}:${POSTGRES_PASSWORD:-wie_password}@db:5432/${POSTGRES_DB:-wie_db}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wie_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wie_celery_worker
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-wie_user}:${POSTGRES_PASSWORD:-wie_password}@db:5432/${POSTGRES_DB:-wie_db}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A worker.celery_app worker --loglevel=info --pool=solo

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
